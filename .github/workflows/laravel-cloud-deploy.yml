name: Laravel Cloud Deploy (reusable)

# Reusable workflow that deploys a Laravel app to a Hostinger Cloud Startup
# subdomain via SSH. Called by app repos (e.g. Codenzia/serveeta).
#
# Prerequisites on the host (one-time per app):
#   1. `~/codenzia/deploy-runtime/` is a git clone of this repo.
#   2. The subdomain exists in hPanel (Hostinger has no API for shared
#      hosting subdomain creation — this stays manual).
#   3. The repo's deploy public key is appended to ~/.ssh/authorized_keys.
#   4. PHP version is set in hPanel.
#
# What the workflow does automatically on first deploy:
#   - Detects "apps/deploy.sh missing" and runs provision-app.sh from the
#     host's deploy-runtime clone — creates apps/shared/{.env,storage,
#     database.sqlite}, drops the activator + .htaccess template.
#   - Subsequent deploys skip the provision step (idempotent).
#
# What you still do manually after the first deploy fires provision:
#   - Seed apps/shared/.env with APP_KEY + DB path + secrets
#     (provision-app.sh prints the exact paths to use).
#   - Add the 2 cron lines (scheduler + queue worker) in hPanel →
#     Advanced → Cron Jobs (provision-app.sh prints them too).

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app slug (e.g. serveeta) — used as APP env on host"
        required: true
        type: string
      domain:
        description: "Full FQDN (e.g. serveeta.codenzia.com)"
        required: true
        type: string
      siblings:
        description: |
          Multiline list of sibling Composer path-repo packages to clone
          alongside the app, one per line in the format:
            <github-org/repo> <target-dir-relative-to-workspace>
          Example:
            Codenzia/Platform                 platform
            Codenzia/filament-panel-base-dev  filament-panel-base
          Defaults to empty — apps that don't use Composer path repositories
          can omit this input entirely; the clone step then becomes a no-op.
        required: false
        type: string
        default: ""
      demo_seeder:
        description: "Seeder class invoked when fresh=true (and on every deploy when always_seed=true)"
        required: false
        type: string
        default: "DemoSeeder"
      always_seed:
        description: "Re-run the idempotent seeder (demo_seeder) on every deploy, without a destructive fresh. For our own seeder-as-source-of-truth sites."
        required: false
        type: boolean
        default: false
      php_bin:
        description: "Absolute path to the PHP binary on the host"
        required: false
        type: string
        default: "/usr/bin/php"
      php_version:
        description: "PHP version installed on the GitHub Actions runner"
        required: false
        type: string
        default: "8.3"
      php_extensions:
        description: "PHP extensions installed on the runner"
        required: false
        type: string
        default: "mbstring,xml,curl,zip,bcmath,intl,gd,mysql"
      node_version:
        description: "Node version on the runner (used for the Vite build)"
        required: false
        type: string
        default: "20"
      fresh:
        description: "Reseed demo data (drops all tables)"
        required: false
        type: boolean
        default: false
      mode:
        description: "release or debug"
        required: false
        type: string
        default: "release"
      migrate:
        description: "Backup existing files (.env / database / uploads)"
        required: false
        type: boolean
        default: false
      smoke_strict:
        description: |
          Fail the run when the deployed site answers with a 5xx. Default true.
          An unreachable host (DNS/TLS not ready) stays a warning either way —
          this only governs responses the server actually produced. Set false
          for a site that is expected to error immediately after activation.
        required: false
        type: boolean
        default: true
      source_dir:
        description: |
          Subdirectory inside the caller repo that holds the Laravel app
          (relative to repo root). Use for monorepos where multiple
          skeletons live in subdirs (e.g. aqarkom's tier skeletons at
          aqarkom-lite/, aqarkom-standard/, aqarkom-pro/). Leave empty
          for the single-app-at-root case (every existing caller).
        required: false
        type: string
        default: ""
    # Secrets are declared (so cross-repo inheritance forwards them) but
    # NOT marked required: callers may use `secrets: inherit`, which the
    # workflow_call validator can't resolve at parse time — `required: true`
    # would then reject the call. At runtime, the inherited values flow
    # through normally; if any are missing, the individual step (clone,
    # ssh-agent) will fail with a clear error.
    secrets:
      CODENZIA_PAT:
        required: false
      HOST_HOSTNAME:
        required: false
      HOST_USER:
        required: false
      HOST_PORT:
        required: false
      HOST_SSH_KEY:
        required: false
      HOST_KNOWN_HOSTS:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Note: do NOT add `environment:` here. We tried it for deployment-
    # tracking visibility — it scoped secret resolution to that env and
    # broke inheritance from the caller. Secrets resolve cleanly without
    # an env on the job.
    env:
      APP_NAME: ${{ inputs.app_name }}
      DOMAIN: ${{ inputs.domain }}
      DEMO_SEEDER: ${{ inputs.demo_seeder }}
      ALWAYS_SEED: ${{ inputs.always_seed }}
      PHP_BIN: ${{ inputs.php_bin }}
    defaults:
      run:
        # When source_dir is set (monorepo callers), this resolves to
        # `app/<source_dir>` so every default-working-dir step lands inside
        # the chosen tier's skeleton. Single-app callers leave source_dir
        # empty and this stays as `app`.
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
    steps:
      - name: Validate deploy inputs
        working-directory: ${{ github.workspace }}
        env:
          DOMAIN_IN: ${{ inputs.domain }}
          APP_IN: ${{ inputs.app_name }}
          SEEDER_IN: ${{ inputs.demo_seeder }}
          PHPBIN_IN: ${{ inputs.php_bin }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$DOMAIN_IN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo "::error::domain '$DOMAIN_IN' contains illegal characters"; exit 1; }
          [[ "$APP_IN"    =~ ^[a-z0-9][a-z0-9_-]*$ ]]            || { echo "::error::app_name '$APP_IN' contains illegal characters"; exit 1; }
          [[ "$SEEDER_IN" =~ ^[A-Za-z0-9\\_]+$ ]]                || { echo "::error::demo_seeder '$SEEDER_IN' contains illegal characters"; exit 1; }
          [[ "$PHPBIN_IN" =~ ^[A-Za-z0-9/._-]+$ ]]               || { echo "::error::php_bin '$PHPBIN_IN' contains illegal characters"; exit 1; }
          [[ "$MODE_IN"   =~ ^(release|debug)$ ]]                || { echo "::error::mode must be release|debug"; exit 1; }

      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: app

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}/package-lock.json

      - name: Clone sibling Composer packages
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          set -euo pipefail
          while IFS= read -r raw; do
            line="$(echo "$raw" | sed 's/#.*$//' | xargs)"
            [ -z "$line" ] && continue
            read -r repo dest <<<"$line"
            echo "::group::clone $repo -> $dest"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$dest"
            echo "::endgroup::"
          done <<< "$SIBLINGS"

      - name: Register sibling path repos in composer.json
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        env:
          SIBLINGS: ${{ inputs.siblings }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLINGS" ]; then
            echo "no siblings input; skipping path-repo registration"
            exit 0
          fi
          # Append a path repo for each cloned sibling to composer.json's
          # `repositories` array. Path repos always beat VCS sources for
          # the same package, so composer install will resolve sibling
          # packages from the freshly-cloned local copies (current HEAD of
          # each sibling's main branch) instead of going to GitHub VCS
          # — no Composer github-oauth setup needed, and no dependency on
          # the consuming app having wikimedia/composer-merge-plugin
          # wired up to read composer.local.json. The mutation is
          # in-place on the CI checkout only; the committed composer.json
          # is untouched.
          python3 - <<'PY'
          import json, os
          # Depth = 1 (cwd is `app/`) + nested levels of source_dir.
          # Siblings clone into github.workspace, so each `../` walks one
          # directory closer to it. Empty source_dir → 1 dot-dot.
          source_dir = os.environ.get('SOURCE_DIR', '').strip('/')
          depth = 1 + (source_dir.count('/') + 1 if source_dir else 0)
          prefix = '../' * depth
          with open('composer.json', 'r', encoding='utf-8') as f:
              cj = json.load(f)
          cj.setdefault('repositories', [])
          existing = {r.get('url') for r in cj['repositories'] if isinstance(r, dict)}
          added = 0
          for raw in os.environ['SIBLINGS'].splitlines():
              line = raw.split('#', 1)[0].strip()
              if not line:
                  continue
              parts = line.split()
              if len(parts) != 2:
                  continue
              repo, dest = parts
              url = f'{prefix}{dest}'
              if url in existing:
                  continue
              cj['repositories'].append({
                  'type': 'path',
                  'url': url,
                  'options': {'symlink': True},
              })
              added += 1
          with open('composer.json', 'w', encoding='utf-8') as f:
              json.dump(cj, f, indent=4)
              f.write('\n')
          print(f'added {added} sibling path repos to composer.json')
          PY

      - name: Create placeholder SQLite DB for boot-time package discovery
        # composer install's post-autoload-dump runs `php artisan
        # package:discover`, which boots every service provider. Some
        # providers (e.g. spatie/laravel-translation-loader) query the DB
        # at boot — fails with "Database file does not exist" if the
        # SQLite file is missing on the CI runner. The real DB lives on
        # the host at apps/shared/database.sqlite; this is just an empty
        # placeholder so the discovery boot can run.
        run: |
          mkdir -p database
          [ -f database/database.sqlite ] || touch database/database.sqlite

      - name: Install PHP dependencies (prod)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.CODENZIA_PAT }}"},"http-basic":{"packages.codenzia.com":{"username":"${{ secrets.SATIS_USER }}","password":"${{ secrets.SATIS_PASS }}"}}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # '/tests' and '/docs' MUST keep their leading slash. An rsync pattern
      # with no slash matches that basename at any depth, so a bare 'docs'
      # also drops resources/views/docs, app/**/docs, etc. Patterns meant to
      # match anywhere (node_modules, .git, *.log) stay unanchored on purpose.
      - name: Stage artifact (dereference path-repo symlinks)
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        run: |
          mkdir -p _artifact
          rsync -aL \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='.claude' \
            --exclude='.agents' \
            --exclude='.gemini' \
            --exclude='node_modules' \
            --exclude='/tests' \
            --exclude='/docs' \
            --exclude='public/hot' \
            --exclude='*.log' \
            --exclude='*.sqlite' \
            --exclude='*.map' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='_artifact' \
            ./ _artifact/

      # Build traceability stamp. Written INTO the staged artifact (after the
      # rsync filter has run, so no exclude can strip it) at the release root,
      # which becomes Laravel's base_path on the host (public_html/) — next to
      # artisan, never under public/. The top-level .htaccess rewrites every
      # request into public/, so /build.json is not web-servable. The release
      # activator (deploy.sh) does not exclude it. codenzia/filament-panel-base
      # reads base_path('build.json') for its Version Info widget. Purely
      # additive: no new inputs, no failure path.
      - name: Stamp release with build.json
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg commit_short "${GITHUB_SHA:0:7}" \
            --arg ref "$GITHUB_REF" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg target "" \
            --arg domain "$DOMAIN" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,commit_short:$commit_short,ref:$ref,branch:$branch,run_number:$run_number,run_id:$run_id,workflow:$workflow,repository:$repository,target:$target,domain:$domain,deployed_at:$deployed_at}' \
            > _artifact/build.json
          cat _artifact/build.json

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOST_SSH_KEY }}

      - name: Trust host key + install connect-retry helper
        working-directory: ${{ github.workspace }}
        env:
          HOST_KNOWN_HOSTS: ${{ secrets.HOST_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$HOST_KNOWN_HOSTS" ]; then
            echo "$HOST_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

          # Connect-retry helper. GitHub-hosted (Azure) runners intermittently
          # blackhole the FIRST connection to the Hostinger host — "connect to
          # host ... port ...: Connection timed out", ssh exit 255 — while the
          # identical job re-run minutes later succeeds. It is transient path
          # loss between the two networks, and the windows last MINUTES, so
          # back-to-back retries inside one 30s window do not clear them. A
          # single 75s backoff did not either — dari-platform lost its first
          # attempt three times in a row after v1.3.0 shipped, on windows
          # measured past 105s — so there are two: 75s, then 150s.
          #
          # Wrap ONLY commands that are safe to run twice. Steps that mutate
          # state non-idempotently get a connectivity gate instead — see
          # "Activate release".
          cat > ~/.ssh-retry.sh <<'SH'
          retry() {
            if "$@"; then return 0; fi
            echo "::warning::remote command failed: $* — retrying in 75s (suspected transient runner-to-host path loss)"
            sleep 75
            if "$@"; then return 0; fi
            echo "::warning::still failing: $* — one last retry in 150s"
            sleep 150
            if "$@"; then return 0; fi
            echo "::error::remote connect failed three times across ~4 minutes — treat as host outage, not transient path loss (command: $*)"
            return 1
          }
          SH

      - name: Compute release id
        working-directory: ${{ github.workspace }}
        run: |
          REL="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}"
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: Auto-provision app on host (first deploy only)
        # Detects "this subdomain has never been deployed before" by the
        # absence of apps/deploy.sh, and runs provision-app.sh from the
        # host's deploy-runtime clone to create shared/, the activator,
        # the .htaccess template, and the SQLite db. Idempotent: subsequent
        # deploys skip this step in <1s. Subdomain still has to exist in
        # hPanel first (Hostinger has no API for that on shared hosting).
        env:
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_HOSTNAME: ${{ secrets.HOST_HOSTNAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
        working-directory: ${{ github.workspace }}
        run: |
          # Build the remote script locally so $DOMAIN and $APP_NAME resolve
          # to the workflow's resolved values BEFORE being piped to the
          # remote shell (env vars set in `env:` aren't auto-forwarded by ssh).
          REMOTE_SCRIPT=$(cat <<EOF
            set -euo pipefail
            APPS="domains/${DOMAIN}/apps"
            RUNTIME="\$HOME/codenzia/deploy-runtime"

            if [ ! -d "domains/${DOMAIN}" ]; then
              echo "FATAL: domains/${DOMAIN}/ does not exist on the host."       >&2
              echo "       Create the subdomain in hPanel first, then re-run."   >&2
              exit 1
            fi

            # Keep the host's deploy-runtime clone current so fixes to deploy.sh
            # propagate on EVERY deploy, not just first provision.
            if [ -d "\$RUNTIME/.git" ]; then
              git -C "\$RUNTIME" pull --ff-only --quiet || echo "warn: could not fast-forward \$RUNTIME"
            fi

            if [ -x "\${APPS}/deploy.sh" ]; then
              # Already provisioned — just refresh deploy.sh from the clone so
              # script changes take effect without a full re-provision.
              if [ -f "\$RUNTIME/deploy.sh" ]; then
                install -m 0750 "\$RUNTIME/deploy.sh" "\${APPS}/deploy.sh"
                echo "→ refreshed \${APPS}/deploy.sh from \$RUNTIME/deploy.sh"
              fi
              exit 0
            fi

            if [ ! -x "\$RUNTIME/provision-app.sh" ]; then
              echo "FATAL: \$HOME/codenzia/deploy-runtime/provision-app.sh not found." >&2
              echo "       Clone Codenzia/deploy-runtime to ~/codenzia/deploy-runtime first." >&2
              exit 1
            fi

            echo "→ Provisioning ${APP_NAME} on ${DOMAIN} (first deploy)"
            bash "\$RUNTIME/provision-app.sh" "${APP_NAME}" "${DOMAIN}"
            echo "→ Provision done. NEXT: seed shared/.env (APP_KEY + DB path + secrets) and add the cron lines printed above in hPanel."
          EOF
          )
          . ~/.ssh-retry.sh
          # Wrapped in a function so `retry` can re-feed the script on a second
          # attempt (a herestring's stdin is consumed by the first one). The
          # remote script is idempotent: git pull --ff-only, install -m, and a
          # provision run guarded by the presence of apps/deploy.sh.
          run_provision() { ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" bash -s <<< "$REMOTE_SCRIPT"; }
          retry run_provision

      - name: Rsync release to host
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        env:
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_HOSTNAME: ${{ secrets.HOST_HOSTNAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
        run: |
          set -euo pipefail
          . ~/.ssh-retry.sh
          APPS="domains/${DOMAIN}/apps"
          retry ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" "mkdir -p \"${APPS}/releases/${REL}\""
          retry rsync -az --delete -e "ssh -p $HOST_PORT" _artifact/ "${HOST_USER}@${HOST_HOSTNAME}:${APPS}/releases/${REL}/"

      - name: Enforce secure session cookie on release
        if: ${{ inputs.mode == 'release' }}
        env:
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_HOSTNAME: ${{ secrets.HOST_HOSTNAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
        run: |
          # Production is served over HTTPS, so the session cookie must carry
          # the Secure flag. shared/.env is seeded by hand on first deploy and
          # may omit it — guarantee it here (idempotent) before activation so
          # deploy.sh's config:cache picks it up. Runs only on release mode.
          . ~/.ssh-retry.sh
          # Staged to a file, not piped from a heredoc: `retry` re-invokes the
          # command, and a heredoc's stdin is consumed by the first attempt.
          cat > /tmp/secure-cookie-remote.sh <<EOF
          set -euo pipefail
          ENV_FILE="domains/${DOMAIN}/apps/shared/.env"
          if [ ! -f "\$ENV_FILE" ]; then
            echo "warning: \$ENV_FILE not found yet (seed shared/.env first); skipping"
            exit 0
          fi
          if grep -q '^SESSION_SECURE_COOKIE=' "\$ENV_FILE"; then
            sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=true/' "\$ENV_FILE"
          else
            printf '\nSESSION_SECURE_COOKIE=true\n' >> "\$ENV_FILE"
          fi
          echo "→ SESSION_SECURE_COOKIE=true ensured in \$ENV_FILE"
          EOF
          run_secure_cookie() { ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" bash -s < /tmp/secure-cookie-remote.sh; }
          retry run_secure_cookie

      - name: Activate release
        env:
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_HOSTNAME: ${{ secrets.HOST_HOSTNAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          FRESH: ${{ inputs.fresh }}
          MODE: ${{ inputs.mode }}
          MIGRATE: ${{ inputs.migrate }}
          ALWAYS_SEED: ${{ inputs.always_seed }}
        run: |
          . ~/.ssh-retry.sh
          # Activation runs migrations and flips the `current` symlink, so it is
          # NOT blindly retryable. Gate it on a connection that IS retryable: if
          # the runner-to-host path is blackholed, the gate absorbs the backoffs
          # and the real command then runs once, on a proven-open path.
          retry ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" true || exit 1
          ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" \
            "APP='${APP_NAME}' DOMAIN='${DOMAIN}' REL='${REL}' FRESH='${FRESH}' MODE='${MODE}' MIGRATE='${MIGRATE}' DEMO_SEEDER='${DEMO_SEEDER}' ALWAYS_SEED='${ALWAYS_SEED}' PHP_BIN='${PHP_BIN}' bash \"domains/${DOMAIN}/apps/deploy.sh\""

      - name: Smoke test
        working-directory: ${{ github.workspace }}
        env:
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_HOSTNAME: ${{ secrets.HOST_HOSTNAME }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          SMOKE_STRICT: ${{ inputs.smoke_strict }}
        run: |
          ssh -p "$HOST_PORT" "${HOST_USER}@${HOST_HOSTNAME}" \
            "test -f \"domains/${DOMAIN}/public_html/public/index.php\" \
             && test -L \"domains/${DOMAIN}/public_html/.env\" \
             && test -L \"domains/${DOMAIN}/public_html/storage\""
          # The old version piped every failure into `|| echo warning`, so a
          # site serving 500 (missing APP_KEY, unseeded .env, bad DB path)
          # finished the run green. Now: 5xx is a hard failure, an unreachable
          # host stays a warning (DNS/TLS genuinely lag a first deploy), and a
          # 404 on /up falls back to the document root for apps with no health
          # route. Set smoke_strict: false to restore warn-only behaviour.
          # curl already prints 000 on a connection failure, so `|| echo 000`
          # would concatenate a second one and produce "000000" — which matches
          # no case below and would hard-fail the very situation we tolerate.
          probe() {
            local out
            out="$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$1" 2>/dev/null || true)"
            printf '%s' "${out:-000}"
          }

          url="https://${DOMAIN}/up"
          code=000

          for attempt in 1 2 3; do
            code="$(probe "$url")"

            # No health route on this app — judge the document root instead.
            if [ "$code" = "404" ] && [ "$url" != "https://${DOMAIN}/" ]; then
              url="https://${DOMAIN}/"
              code="$(probe "$url")"
            fi

            case "$code" in
              2*|3*) break ;;
            esac

            [ "$attempt" -lt 3 ] && sleep 10
          done

          echo "smoke: ${url} -> HTTP ${code}"

          case "$code" in
            2*|3*)
              echo "smoke test passed"
              ;;
            000)
              echo "::warning title=Smoke test inconclusive::${url} unreachable (DNS or TLS may not be ready yet). The release is activated but unverified."
              ;;
            *)
              if [ "${SMOKE_STRICT}" = "true" ]; then
                echo "::error title=Smoke test failed::${url} returned HTTP ${code}. The release is live and serving errors — check apps/shared/.env (APP_KEY, DB_DATABASE) and storage/logs."
                exit 1
              fi
              echo "::warning title=Smoke test failed::${url} returned HTTP ${code} (smoke_strict is false, not failing the run)."
              ;;
          esac
