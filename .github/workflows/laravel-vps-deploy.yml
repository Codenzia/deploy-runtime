name: Laravel VPS Deploy (reusable)

# Reusable workflow that deploys a Laravel app to a Hostinger KVM VPS running
# CloudPanel + nginx + Percona. Companion to laravel-cloud-deploy.yml (which
# targets Hostinger shared hosting).
#
# Layout assumption — CloudPanel default:
#   /home/<vps_user>/htdocs/<domain>/    — vhost docroot (Laravel app lands here)
#   Laravel's public/ becomes / via .htaccess routing — same pattern as the
#   codenzia.com case on shared. (Atomic releases are a future improvement.)
#
# Prerequisites per-domain (one-time, manual):
#   1. CloudPanel site exists  : clpctl site:add:php --domainName=<domain> --phpVersion=8.3 --siteUser=<user> ...
#   2. SSL cert installed      : clpctl lets-encrypt:install:certificate --domainName=<domain>
#   3. Deploy pubkey appended  : echo "ssh-ed25519 ..." >> /home/<vps_user>/.ssh/authorized_keys
#
# DB: SQLite at /home/<user>/htdocs/<domain>/database/database.sqlite — workflow
# auto-creates the file on first deploy. No MySQL provisioning required.
#
# Required repo secrets (shared across all caller workflows):
#   CODENZIA_PAT  — composer-auth for private Codenzia packages
#   VPS_HOSTNAME  — VPS IP or hostname (e.g. 31.97.78.215)
#   VPS_PORT      — SSH port (typically 22)
#   VPS_SSH_KEY   — private key matching the pubkey added to authorized_keys

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app slug — APP_NAME in .env"
        required: true
        type: string
      domain:
        description: "Full FQDN (e.g. task-off.com)"
        required: true
        type: string
      source_dir:
        description: |
          Subdirectory inside the caller repo that holds the Laravel app
          (relative to repo root). Empty for single-app callers.
        required: false
        type: string
        default: ""
      siblings:
        description: |
          Multiline list of sibling Composer path-repo packages to clone, one per
          line: <github-org/repo> <target-dir-relative-to-workspace>
        required: false
        type: string
        default: ""
      php_version:
        description: "PHP version on runner + remote"
        required: false
        type: string
        default: "8.3"
      php_extensions:
        description: "PHP extensions on runner"
        required: false
        type: string
        default: "mbstring,xml,curl,zip,bcmath,intl,gd,mysql"
      node_version:
        description: "Node version on runner"
        required: false
        type: string
        default: "20"
      fresh:
        description: "Reseed (drops all tables) — refused on prod-classified hosts"
        required: false
        type: boolean
        default: false
      demo_seeder:
        description: "Seeder class when fresh=true"
        required: false
        type: string
        default: "DatabaseSeeder"
      mode:
        description: "release or debug"
        required: false
        type: string
        default: "release"
      vps_user:
        description: "CloudPanel site user that owns /home/<user>/htdocs/<domain>"
        required: true
        type: string
    secrets:
      CODENZIA_PAT:
        required: false
      VPS_HOSTNAME:
        required: false
      VPS_PORT:
        required: false
      VPS_SSH_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: ${{ inputs.app_name }}
      DOMAIN: ${{ inputs.domain }}
      DEMO_SEEDER: ${{ inputs.demo_seeder }}
    defaults:
      run:
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
    steps:
      - name: Validate deploy inputs
        working-directory: ${{ github.workspace }}
        env:
          DOMAIN_IN: ${{ inputs.domain }}
          APP_IN: ${{ inputs.app_name }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$DOMAIN_IN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo "::error::domain illegal"; exit 1; }
          [[ "$APP_IN"    =~ ^[a-z0-9][a-z0-9_-]*$ ]]            || { echo "::error::app_name illegal"; exit 1; }
          [[ "$MODE_IN"   =~ ^(release|debug)$ ]]                || { echo "::error::mode must be release|debug"; exit 1; }

      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: app

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}/package-lock.json

      - name: Clone sibling Composer packages
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLINGS" ]; then echo "no siblings"; exit 0; fi
          while IFS= read -r raw; do
            line="$(echo "$raw" | sed 's/#.*$//' | xargs)"
            [ -z "$line" ] && continue
            read -r repo dest <<<"$line"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$dest"
          done <<< "$SIBLINGS"

      - name: Register sibling path repos in composer.json
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        env:
          SIBLINGS: ${{ inputs.siblings }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLINGS" ]; then echo "no siblings"; exit 0; fi
          python3 - <<'PY'
          import json, os
          source_dir = os.environ.get('SOURCE_DIR', '').strip('/')
          depth = 1 + (source_dir.count('/') + 1 if source_dir else 0)
          prefix = '../' * depth
          with open('composer.json', 'r', encoding='utf-8') as f:
              cj = json.load(f)
          cj.setdefault('repositories', [])
          existing = {r.get('url') for r in cj['repositories'] if isinstance(r, dict)}
          for raw in os.environ['SIBLINGS'].splitlines():
              line = raw.split('#', 1)[0].strip()
              if not line: continue
              parts = line.split()
              if len(parts) != 2: continue
              repo, dest = parts
              url = f'{prefix}{dest}'
              if url in existing: continue
              cj['repositories'].append({'type': 'path', 'url': url, 'options': {'symlink': True}})
          with open('composer.json', 'w', encoding='utf-8') as f:
              json.dump(cj, f, indent=4); f.write('\n')
          PY

      - name: Ensure Laravel storage + views subdirs exist (gitignored on most apps)
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/testing
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          mkdir -p resources/views

      - name: Create placeholder SQLite DB for boot-time package discovery
        # composer install's post-autoload-dump runs `php artisan package:discover`,
        # which boots the app. Without .env loaded, the default DB connection
        # often falls back to sqlite at database/database.sqlite — a missing file
        # there hard-fails boot. The real DB on the host is MySQL.
        run: |
          mkdir -p database
          [ -f database/database.sqlite ] || touch database/database.sqlite

      - name: Install PHP dependencies (prod)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.CODENZIA_PAT }}"},"http-basic":{"packages.codenzia.com":{"username":"${{ secrets.SATIS_USER }}","password":"${{ secrets.SATIS_PASS }}"}}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # '/tests' and '/docs' MUST keep their leading slash. An rsync pattern
      # with no slash matches that basename at any depth, so a bare 'docs'
      # also drops resources/views/docs, app/**/docs, etc. Patterns meant to
      # match anywhere (node_modules, .git, *.log) stay unanchored on purpose.
      - name: Stage artifact (dereference path-repo symlinks)
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        run: |
          mkdir -p _artifact
          rsync -aL \
            --exclude='.git' --exclude='.github' --exclude='.vscode' --exclude='.idea' \
            --exclude='.claude' --exclude='.agents' --exclude='.gemini' \
            --exclude='node_modules' --exclude='/tests' --exclude='/docs' \
            --exclude='public/hot' --exclude='*.log' --exclude='*.sqlite' --exclude='*.map' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='storage/logs/*' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' \
            --exclude='_artifact' \
            ./ _artifact/

      # Build traceability stamp. Written INTO the staged artifact (after the
      # rsync filter has run, so no exclude can strip it) at the app root,
      # which lands at /home/<user>/htdocs/<domain>/build.json — next to
      # artisan, never under public/. The CloudPanel site's Root Directory must
      # point at .../public (required for Laravel anyway), so it is not
      # web-servable. codenzia/filament-panel-base reads base_path('build.json')
      # for its Version Info widget. Purely additive: no new inputs, no failure
      # path; the file carries only public Git/CI metadata, never secrets.
      - name: Stamp release with build.json
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg commit_short "${GITHUB_SHA:0:7}" \
            --arg ref "$GITHUB_REF" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg target "" \
            --arg domain "$DOMAIN" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,commit_short:$commit_short,ref:$ref,branch:$branch,run_number:$run_number,run_id:$run_id,workflow:$workflow,repository:$repository,target:$target,domain:$domain,deployed_at:$deployed_at}' \
            > _artifact/build.json
          cat _artifact/build.json

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host key + install connect-retry helper
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

          # Connect-retry helper. GitHub-hosted (Azure) runners intermittently
          # blackhole the FIRST connection to the Hostinger VPS — "connect to
          # host ... port ...: Connection timed out", ssh exit 255 — while the
          # identical job re-run minutes later succeeds. It is transient path
          # loss between the two networks, and the windows last MINUTES, so
          # back-to-back retries inside one 30s window do not clear them. A
          # single 75s backoff did not either — dari-platform lost its first
          # attempt three times in a row after v1.3.0 shipped, on windows
          # measured past 105s — so there are two: 75s, then 150s.
          #
          # Wrap ONLY commands that are safe to run twice. Steps that mutate
          # state non-idempotently get a connectivity gate instead — see
          # "Seed .env if missing + activate release".
          cat > ~/.ssh-retry.sh <<'SH'
          retry() {
            if "$@"; then return 0; fi
            echo "::warning::remote command failed: $* — retrying in 75s (suspected transient runner-to-host path loss)"
            sleep 75
            if "$@"; then return 0; fi
            echo "::warning::still failing: $* — one last retry in 150s"
            sleep 150
            if "$@"; then return 0; fi
            echo "::error::remote connect failed three times across ~4 minutes — treat as host outage, not transient path loss (command: $*)"
            return 1
          }
          SH

      - name: Wipe CloudPanel skeleton remnants
        working-directory: ${{ github.workspace }}
        env:
          VPS_USER: ${{ inputs.vps_user }}
          VPS_HOSTNAME: ${{ secrets.VPS_HOSTNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # CloudPanel's Laravel-template scaffolds a sample app under htdocs/
          # with hidden dirs (.cursor/, etc.) that rsync --delete --force can't
          # clean. Wipe them explicitly before rsync. Preserves .env at root.
          . ~/.ssh-retry.sh
          retry ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOSTNAME}" \
            "ROOT=/home/${VPS_USER}/htdocs/${DOMAIN}; \
             [ -d \"\$ROOT\" ] || exit 0; \
             find \"\$ROOT\" -maxdepth 1 -name '.*' -not -name '.' -not -name '..' -not -name '.env' -exec rm -rf {} + 2>/dev/null; \
             [ -d \"\$ROOT/public\" ] && find \"\$ROOT/public\" -maxdepth 1 -name '.*' -not -name '.' -not -name '..' -exec rm -rf {} + 2>/dev/null; \
             true"

      - name: Rsync release to VPS htdocs
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
        env:
          VPS_USER: ${{ inputs.vps_user }}
          VPS_HOSTNAME: ${{ secrets.VPS_HOSTNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          . ~/.ssh-retry.sh
          DEST="${VPS_USER}@${VPS_HOSTNAME}:/home/${VPS_USER}/htdocs/${DOMAIN}/"
          # --delete removes host files absent from the artifact, which keeps
          # stale code out -- but the live database, .env, uploads, sessions and
          # logs are never IN the artifact, so they must be protected, not
          # excluded: with --delete-excluded an --exclude'd path is DELETED on
          # the host, which is exactly how every deploy wiped database.sqlite
          # and re-seeded .env from the template. 'P' = protect: never deleted
          # on the receiver, never overwritten because nothing in the artifact
          # matches it.
          retry rsync -az --delete --force \
            --filter='P /.env' \
            --filter='P /database/*.sqlite' \
            --filter='P /database/*.sqlite-*' \
            --filter='P /storage/app/**' \
            --filter='P /storage/framework/sessions/**' \
            --filter='P /storage/logs/**' \
            -e "ssh -p $VPS_PORT" \
            _artifact/ "$DEST"

      - name: Seed .env if missing + activate release
        env:
          VPS_USER: ${{ inputs.vps_user }}
          VPS_HOSTNAME: ${{ secrets.VPS_HOSTNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          FRESH: ${{ inputs.fresh }}
          MODE: ${{ inputs.mode }}
        run: |
          . ~/.ssh-retry.sh
          # Seeds .env and runs migrations, so it is NOT blindly retryable.
          # Gate it on a connection that IS retryable: if the runner-to-host
          # path is blackholed, the gate absorbs the backoffs and the real
          # command then runs once, on a path already proven open.
          retry ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOSTNAME}" true || exit 1
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOSTNAME}" bash -s <<EOF
          set -euo pipefail
          ROOT="/home/${VPS_USER}/htdocs/${DOMAIN}"
          cd "\$ROOT"

          # Ensure SQLite home exists.
          mkdir -p database
          touch database/database.sqlite

          # Seed .env on first deploy.
          if [ ! -f .env ]; then
            APP_KEY="base64:\$(openssl rand -base64 32)"
            CPW="\$(openssl rand -base64 18 | tr -d '+/=' | head -c 24)"
            SAPW="\$(openssl rand -base64 18 | tr -d '+/=' | head -c 24)"
            APP_ENV=\$([ "${MODE}" = "release" ] && echo production || echo local)
            APP_DEBUG=\$([ "${MODE}" = "release" ] && echo false || echo true)
            # HTTPS-served prod hosts must mark the session cookie Secure.
            SESSION_SECURE=\$([ "${MODE}" = "release" ] && echo true || echo false)
            cat > .env <<INNER
          APP_NAME="${APP_NAME}"
          APP_ENV=\$APP_ENV
          APP_KEY=\$APP_KEY
          APP_DEBUG=\$APP_DEBUG
          APP_URL=https://${DOMAIN}

          LOG_CHANNEL=daily
          LOG_LEVEL=warning

          DB_CONNECTION=sqlite
          DB_DATABASE=\$ROOT/database/database.sqlite

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          SESSION_SECURE_COOKIE=\$SESSION_SECURE
          QUEUE_CONNECTION=database
          # Mail is OFF until you set it: with the log mailer every password
          # reset and notification email is written to storage/logs instead of
          # sent. Fill these in on the host before the first real user.
          MAIL_MAILER=log
          # MAIL_HOST=smtp.example.com
          # MAIL_PORT=587
          # MAIL_USERNAME=
          # MAIL_PASSWORD=
          # MAIL_ENCRYPTION=tls
          # MAIL_FROM_ADDRESS=noreply@${DOMAIN}
          # MAIL_FROM_NAME="${APP_NAME}"

          CONSOLE_USER=admin
          CONSOLE_PASSWORD=\$CPW
          ADMIN_PASSWORD=\$CPW
          ADMIN_SEED_PASSWORD=\$CPW
          
          # The protected super admin (codenzia/laravel-superadmin). This is the
          # identity every deploy re-asserts with `superadmin:ensure --from-env`, so a
          # reseed never leaves a random password behind. Vendor-operated host:
          # change either value here any time. For a customer-facing host, blank
          # the password: the package then keeps a random one and the /superadmin
          # recovery route (needs MAIL_*) is the way in.
          SUPER_ADMIN_EMAIL=superadmin@${DOMAIN}
          SUPER_ADMIN_PASSWORD=\$SAPW
          INNER
            chmod 600 .env
            echo "Seeded .env (console password generated — read it from .env on the host; it is not printed here)"
          fi

          # Refresh caches + run migrations.
          php artisan optimize:clear || true
          php artisan migrate --force

          if [ "${FRESH}" = "true" ]; then
            php artisan migrate:fresh --seed --seeder="${DEMO_SEEDER}" --force
          fi

          # Re-assert the protected super admin from .env after every migrate/seed:
          # a reseed drops the row and the package would recreate it with a random
          # password. Skipped cleanly on apps that do not ship the package.
          if php artisan list --raw 2>/dev/null | grep -q "^superadmin:ensure"; then
            php artisan superadmin:ensure --from-env || true
          fi
          php artisan storage:link || true
          php artisan vendor:publish --tag=livewire:assets --force 2>/dev/null || true
          php artisan vendor:publish --tag=filament-assets --force 2>/dev/null || true
          php artisan config:cache || true
          php artisan route:cache || true
          php artisan view:cache || true
          php artisan event:cache || true
          EOF

      - name: Smoke test
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/up" || true)
          if [ "$CODE" != "200" ]; then
            echo "::warning::smoke test got $CODE on https://${DOMAIN}/up (might be OK if app has no /up route)"
          else
            echo "smoke test green"
          fi
