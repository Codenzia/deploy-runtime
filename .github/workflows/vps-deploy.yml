name: VPS Deploy (reusable)

# Reusable workflow that deploys a Laravel app to the Codenzia Hostinger KVM
# VPS (CloudPanel) using atomic releases. Called by app repos (e.g.
# Codenzia/task-off via .github/workflows/deploy-vps.yml).
#
# Per-site config (site_user/domain) is resolved by the CALLER from its
# deploy/targets.json and passed in here, so this workflow stays app-agnostic.
#
# Prerequisites (one-time per site — see VPS-DEPLOY-RUNBOOK.md):
#   1. Site created in CloudPanel UI (creates the Linux user + htdocs/<domain>).
#   2. Deploy public key appended to that site user's ~/.ssh/authorized_keys.
#   3. Repo-level secrets set (Free org plan: org secrets don't reach private
#      repos): VPS_HOST, VPS_PORT, VPS_SSH_KEY, CODENZIA_PAT.
#
# First deploy auto-provisions (creates releases/ shared/ + SQLite DB). You
# then seed shared/.env, set the CloudPanel doc root to current/public, and
# enable TLS — the runbook prints exact values.

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app slug, e.g. task-off"
        required: true
        type: string
      site_user:
        description: "CloudPanel Linux user that owns the site (= SSH user)"
        required: true
        type: string
      domain:
        description: "Full domain, e.g. task-off.com"
        required: true
        type: string
      target:
        description: "Logical target label (production|demo|...) — for logs only"
        required: false
        type: string
        default: ""
      db:
        description: "sqlite (default) or mysql"
        required: false
        type: string
        default: "sqlite"
      fresh:
        description: "migrate:fresh + reseed (DESTROYS data)"
        required: false
        type: boolean
        default: false
      adopt:
        description: "On first deploy, adopt an existing non-atomic deployment's .env/db/storage"
        required: false
        type: boolean
        default: false
      seeder:
        description: "Seeder class invoked when fresh=true (and when always_seed=true)"
        required: false
        type: string
        default: "DatabaseSeeder"
      always_seed:
        description: "Re-run the (idempotent) seeder on every deploy, non-destructively"
        required: false
        type: boolean
        default: false
      sync_superadmin:
        description: "Sync super-admin creds from env each deploy (soft-fails on older apps)"
        required: false
        type: boolean
        default: true
      mode:
        description: "release (APP_ENV=production) | demo (APP_ENV=demo, debug off) | debug (APP_ENV=local, debug on)"
        required: false
        type: string
        default: "release"
      siblings:
        description: |
          Optional Composer path-repo siblings to clone, one per line:
            <github-org/repo> <target-dir-relative-to-workspace>
          Most Codenzia apps resolve private packages via Composer
          github-oauth (CODENZIA_PAT) and can leave this empty.
        required: false
        type: string
        default: ""
      php_version:
        required: false
        type: string
        default: "8.3"
      php_extensions:
        required: false
        type: string
        default: "mbstring,xml,curl,zip,bcmath,intl,gd,mysql,sqlite3,redis"
      node_version:
        required: false
        type: string
        default: "20"
      php_bin:
        description: "PHP binary path on the host"
        required: false
        type: string
        default: "php8.3"
      source_dir:
        description: "Subdir holding the Laravel app (monorepo callers); empty for root"
        required: false
        type: string
        default: ""
    secrets:
      CODENZIA_PAT:
        required: false
      SATIS_USER:
        required: false
      SATIS_PASS:
        required: false
      VPS_HOST:
        required: false
      VPS_PORT:
        required: false
      VPS_SSH_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: ${{ inputs.app_name }}
      SITE_USER: ${{ inputs.site_user }}
      DOMAIN: ${{ inputs.domain }}
      DB: ${{ inputs.db }}
      SEEDER: ${{ inputs.seeder }}
      PHP_BIN: ${{ inputs.php_bin }}
    defaults:
      run:
        working-directory: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: app

      - name: Checkout deploy-runtime (host scripts)
        uses: actions/checkout@v6
        with:
          repository: Codenzia/deploy-runtime
          path: deploy-runtime
          token: ${{ secrets.CODENZIA_PAT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}/package-lock.json

      - name: Authenticate Composer to GitHub (private VCS repos)
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          SATIS_USER: ${{ secrets.SATIS_USER }}
          SATIS_PASS: ${{ secrets.SATIS_PASS }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
            echo "composer github-oauth configured"
          else
            echo "WARN: CODENZIA_PAT empty — private Composer repos will fail to resolve" >&2
          fi
          # Apps that resolve Codenzia packages from the Satis registry
          # (repositories: packages.codenzia.com in their composer.json) need
          # http-basic auth for the metadata. Optional — skipped when unset.
          if [ -n "$SATIS_USER" ] && [ -n "$SATIS_PASS" ]; then
            composer config --global http-basic.packages.codenzia.com "$SATIS_USER" "$SATIS_PASS"
            echo "composer http-basic for packages.codenzia.com configured"
          fi

      - name: Clone sibling Composer packages (optional path repos)
        if: ${{ inputs.siblings != '' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          set -euo pipefail
          while IFS= read -r raw; do
            line="$(echo "$raw" | sed 's/#.*$//' | xargs)"
            [ -z "$line" ] && continue
            read -r repo dest <<<"$line"
            echo "::group::clone $repo -> $dest"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$dest"
            echo "::endgroup::"
          done <<< "$SIBLINGS"

      - name: Register sibling path repos in composer.json
        if: ${{ inputs.siblings != '' }}
        env:
          SIBLINGS: ${{ inputs.siblings }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open('composer.json', 'r', encoding='utf-8') as f:
              cj = json.load(f)
          cj.setdefault('repositories', [])
          existing = {r.get('url') for r in cj['repositories'] if isinstance(r, dict)}
          added = 0
          for raw in os.environ['SIBLINGS'].splitlines():
              line = raw.split('#', 1)[0].strip()
              if not line:
                  continue
              parts = line.split()
              if len(parts) != 2:
                  continue
              repo, dest = parts
              url = f'../{dest}'
              if url in existing:
                  continue
              cj['repositories'].append({'type': 'path', 'url': url, 'options': {'symlink': True}})
              added += 1
          with open('composer.json', 'w', encoding='utf-8') as f:
              json.dump(cj, f, indent=4); f.write('\n')
          print(f'added {added} sibling path repos')
          PY

      - name: Create placeholder SQLite DB for boot-time package discovery
        run: |
          mkdir -p database
          [ -f database/database.sqlite ] || touch database/database.sqlite

      - name: Install PHP dependencies (prod)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # '/tests' and '/docs' MUST keep their leading slash. An rsync pattern
      # with no slash matches that basename at any depth, so a bare 'docs'
      # also drops resources/views/docs, app/**/docs, etc. Patterns meant to
      # match anywhere (node_modules, .git, *.log) stay unanchored on purpose.
      - name: Stage artifact (dereference path-repo symlinks)
        run: |
          mkdir -p _artifact
          rsync -aL \
            --exclude='.git' --exclude='.github' --exclude='.vscode' \
            --exclude='.idea' --exclude='.claude' --exclude='.agents' \
            --exclude='.gemini' --exclude='node_modules' --exclude='/tests' \
            --exclude='/docs' --exclude='public/hot' --exclude='*.log' \
            --exclude='*.sqlite' --exclude='*.map' --exclude='.env' \
            --exclude='.env.*' --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='_artifact' \
            ./ _artifact/

      # Build traceability stamp. Written INTO the staged artifact (after the
      # rsync filter has run, so no exclude can strip it) at the release root,
      # which is Laravel's base_path on the host — next to artisan, never under
      # public/, therefore not web-servable. codenzia/filament-panel-base reads
      # base_path('build.json') to show the deployed build in its Version Info
      # widget. Purely additive: no new inputs, no failure path.
      - name: Stamp release with build.json
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg commit_short "${GITHUB_SHA:0:7}" \
            --arg ref "$GITHUB_REF" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg target "${{ inputs.target }}" \
            --arg domain "$DOMAIN" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,commit_short:$commit_short,ref:$ref,branch:$branch,run_number:$run_number,run_id:$run_id,workflow:$workflow,repository:$repository,target:$target,domain:$domain,deployed_at:$deployed_at}' \
            > _artifact/build.json
          cat _artifact/build.json

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # No ssh-keyscan here, deliberately. The VPS runs fail2ban, and a keyscan
      # is a pure pre-auth connection that closes without authenticating — the
      # exact log line the sshd jail counts. Every deploy therefore chipped away
      # at the Azure runner IP pool it depends on (jail: 81 banned / 499 failed
      # as of 2026-07-26). A ban DROPs packets, so the symptom was a silent
      # timeout at exactly ssh-keyscan's 5s default (-T 5), intermittent because
      # each job lands on a different, possibly not-yet-banned IP. It is NOT
      # sshd MaxStartups: the host was idle (load 0.06) with stock 10:30:100 at
      # failure time, and this workflow never overlaps its own SSH connections.
      # Do not "fix" this with keyscan retries — retries just earn more bans.
      #
      # accept-new performs the same trust-on-first-use pin a keyscan does, but
      # on the connection that then authenticates, leaving nothing pre-auth for
      # the jail to count.
      - name: Trust host key + install connect-retry helper
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

          # Connect-retry helper. GitHub-hosted (Azure) runners intermittently
          # blackhole the FIRST connection to the Hostinger VPS — "connect to
          # host ... port ...: Connection timed out", ssh exit 255, after the
          # 30s ConnectTimeout — while the identical job re-run minutes later
          # succeeds. fail2ban is not involved (no bans at the failure times);
          # it is transient path loss between the two networks. The blackhole
          # windows last MINUTES, so back-to-back retries inside one 30s window
          # do not clear them — and neither does a single 75s backoff, which
          # dari-platform outlasted on three consecutive deploys after v1.3.0
          # shipped (windows measured past 105s). Hence two backoffs: 75s,
          # then 150s, ~4.5 min worst case before the job fails.
          #
          # Wrap ONLY commands that are safe to run twice (uploads, mkdir,
          # chmod, idempotent remote scripts). Steps that mutate state
          # non-idempotently get a connectivity gate instead — see "Activate
          # release".
          cat > ~/.ssh-retry.sh <<'SH'
          retry() {
            if "$@"; then return 0; fi
            echo "::warning::remote command failed: $* — retrying in 75s (suspected transient runner-to-host path loss)"
            sleep 75
            if "$@"; then return 0; fi
            echo "::warning::still failing: $* — one last retry in 150s"
            sleep 150
            if "$@"; then return 0; fi
            echo "::error::remote connect failed three times across ~4 minutes — treat as host outage, not transient path loss (command: $*)"
            return 1
          }
          SH

      - name: Compute release id
        working-directory: ${{ github.workspace }}
        run: echo "REL=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload host scripts + auto-provision (first deploy)
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          ADOPT: ${{ inputs.adopt }}
        run: |
          set -euo pipefail
          . ~/.ssh-retry.sh
          PORT="${VPS_PORT:-22}"
          DEST="${SITE_USER}@${VPS_HOST}"
          SITE_DIR="htdocs/${DOMAIN}"

          # Push the current host scripts (single source of truth = this checkout).
          retry ssh -p "$PORT" "$DEST" "mkdir -p \"${SITE_DIR}/.deploy\""
          retry scp -P "$PORT" deploy-runtime/vps-provision.sh deploy-runtime/vps-deploy.sh deploy-runtime/vps-worker-setup.sh \
            "${DEST}:${SITE_DIR}/.deploy/"
          retry ssh -p "$PORT" "$DEST" "chmod 0750 \"${SITE_DIR}/.deploy/\"*.sh"

          # Provision only if shared/.env is missing (idempotent).
          ADOPT_FLAG=""
          [ "${ADOPT}" = "true" ] && ADOPT_FLAG="--adopt"
          # Staged to a file, not piped from a heredoc: `retry` re-invokes the
          # command, and a heredoc's stdin is consumed by the first attempt.
          cat > /tmp/provision-remote.sh <<EOF
            set -euo pipefail
            if [ -f "\$HOME/${SITE_DIR}/shared/.env" ]; then
              echo "→ already provisioned; skipping"
            else
              echo "→ first deploy: provisioning ${APP_NAME} (${DOMAIN}) ${ADOPT_FLAG}"
              bash "\$HOME/${SITE_DIR}/.deploy/vps-provision.sh" "${APP_NAME}" "${DOMAIN}" ${ADOPT_FLAG}
              echo "→ NEXT: seed shared/.env, set CloudPanel doc root to current/public, enable TLS."
            fi
          EOF
          run_provision() { ssh -p "$PORT" "$DEST" bash -s < /tmp/provision-remote.sh; }
          retry run_provision

      - name: Rsync release to host
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          . ~/.ssh-retry.sh
          PORT="${VPS_PORT:-22}"
          DEST="${SITE_USER}@${VPS_HOST}"
          REL_DIR="htdocs/${DOMAIN}/releases/${REL}"
          retry ssh -p "$PORT" "$DEST" "mkdir -p \"${REL_DIR}\""
          retry rsync -az --delete -e "ssh -p $PORT" \
            app${{ inputs.source_dir != '' && format('/{0}', inputs.source_dir) || '' }}/_artifact/ \
            "${DEST}:${REL_DIR}/"

      - name: Activate release
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          FRESH: ${{ inputs.fresh }}
          MODE: ${{ inputs.mode }}
          ALWAYS_SEED: ${{ inputs.always_seed }}
          SYNC_SUPERADMIN: ${{ inputs.sync_superadmin }}
        run: |
          . ~/.ssh-retry.sh
          PORT="${VPS_PORT:-22}"
          DEST="${SITE_USER}@${VPS_HOST}"
          # Activation runs migrations and flips the `current` symlink, so it is
          # NOT blindly retryable. Instead, gate it on a connection that IS
          # retryable: if the runner-to-host path is blackholed, the gate
          # absorbs the backoffs and the real command then runs once, on a
          # path already proven open.
          retry ssh -p "$PORT" "$DEST" true || exit 1
          ssh -p "$PORT" "$DEST" \
            "APP='${APP_NAME}' DOMAIN='${DOMAIN}' REL='${REL}' DB='${DB}' FRESH='${FRESH}' MODE='${MODE}' SEEDER='${SEEDER}' ALWAYS_SEED='${ALWAYS_SEED}' SYNC_SUPERADMIN='${SYNC_SUPERADMIN}' PHP_BIN='${PHP_BIN}' bash \"htdocs/${DOMAIN}/.deploy/vps-deploy.sh\""

      - name: Smoke test
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          DEST="${SITE_USER}@${VPS_HOST}"
          ssh -p "$PORT" "$DEST" \
            "test -f \"htdocs/${DOMAIN}/current/public/index.php\" \
             && test -L \"htdocs/${DOMAIN}/current/.env\""
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "https://${DOMAIN}/up" \
            || echo "warning: /up smoke failed (TLS/DNS/doc-root may not be ready yet)"

      - name: Livewire asset health check
        working-directory: ${{ github.workspace }}
        run: |
          # Non-fatal: verify the Livewire runtime JS actually loads. CloudPanel's
          # stock vhost 404s dynamic .js routes (see templates/cloudpanel-vhost-
          # laravel.conf); this catches a site whose vhost still lacks the fix.
          HTML="$(curl -fsSL --max-time 20 "https://${DOMAIN}/" || true)"
          SCRIPT_URL="$(printf '%s' "$HTML" \
            | grep -oiE 'src="[^"]*livewire[^"]*\.min\.js[^"]*"' \
            | head -n1 | sed -E 's/^src="//I; s/"$//' || true)"
          if [ -z "$SCRIPT_URL" ]; then
            echo "No Livewire script tag on homepage — skipping (non-Livewire app)."
            exit 0
          fi
          case "$SCRIPT_URL" in
            http*) : ;;
            /*)    SCRIPT_URL="https://${DOMAIN}${SCRIPT_URL}" ;;
            *)     SCRIPT_URL="https://${DOMAIN}/${SCRIPT_URL}" ;;
          esac
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "$SCRIPT_URL" || echo 000)"
          if [ "$CODE" = "200" ]; then
            echo "Livewire script OK (HTTP 200): $SCRIPT_URL"
          else
            echo "::warning::Livewire script $SCRIPT_URL returned $CODE — the CloudPanel vhost is likely missing the try_files fallback; paste templates/cloudpanel-vhost-laravel.conf (see README)."
          fi

      - name: Queue worker health check
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Non-fatal. Reads the health facts vps-deploy.sh recorded on the host
          # (queue worker presence + pending-job count) and surfaces them in the
          # job summary. A missing worker means async jobs (notifications, etc.)
          # never run — the dari.codenzia.com class of bug. See VPS-DEPLOY-RUNBOOK.
          PORT="${VPS_PORT:-22}"
          DEST="${SITE_USER}@${VPS_HOST}"
          HEALTH="$(ssh -p "$PORT" "$DEST" "cat \"htdocs/${DOMAIN}/.deploy/health.env\" 2>/dev/null" || true)"
          if [ -z "$HEALTH" ]; then
            echo "No health.env on host (older vps-deploy.sh, or worker check skipped) — nothing to summarise."
            exit 0
          fi
          get() { printf '%s\n' "$HEALTH" | grep -E "^$1=" | head -n1 | cut -d= -f2-; }
          QUEUE_CONNECTION="$(get QUEUE_CONNECTION)"
          WORKER_STATE="$(get WORKER_STATE)"
          BACKLOG="$(get BACKLOG)"
          WORKER_SETUP_CMD="$(get WORKER_SETUP_CMD)"
          echo "queue health: connection=${QUEUE_CONNECTION} worker=${WORKER_STATE} backlog=${BACKLOG}"
          {
            echo "### Queue worker health — ${APP_NAME} (${DOMAIN})"
            echo ""
            echo "| Signal | Value |"
            echo "| --- | --- |"
            echo "| Queue connection | \`${QUEUE_CONNECTION}\` |"
            echo "| Worker | ${WORKER_STATE} |"
            echo "| Jobs pending | ${BACKLOG} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WORKER_STATE" = "missing" ]; then
            {
              echo ""
              echo "**No queue worker is running.** Async jobs will not be processed. Run as root on the VPS:"
              echo ""
              echo '```'
              echo "${WORKER_SETUP_CMD}"
              echo '```'
              echo ""
              echo "Or add the one-time NOPASSWD sudoers opt-in for hands-off worker setup — see VPS-DEPLOY-RUNBOOK.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::[${APP_NAME}] queue worker MISSING for ${DOMAIN} — run: ${WORKER_SETUP_CMD}"
          fi
