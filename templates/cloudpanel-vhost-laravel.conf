# CloudPanel nginx vhost — Laravel + Livewire v4 / Filament (Codenzia VPS)
# =============================================================================
# This is CloudPanel's standard two-server Laravel template (443 proxy server
# in front of the 8080 PHP-FPM backend, via Varnish) WITH ONE CRITICAL FIX.
#
# WHY THE FIX EXISTS
# ------------------
# CloudPanel's stock 443 server has a static-extension `location` block that
# serves *.js / *.css / *.png / … straight off disk and hard-404s when the
# file is not present. That is correct for real assets, but Livewire v4 and
# Filament serve their runtime JS/CSS through DYNAMIC Laravel routes — e.g.
# `/livewire/livewire.min.js`, `/livewire-<hash>/livewire.min.js`,
# `/livewire/livewire.js.map`. Those URLs end in `.js` so they match the
# static block, have no file on disk, and get 404'd by nginx before Laravel
# ever sees them. Result: every Livewire form / Filament panel on the site is
# silently dead (the browser can't load the Livewire runtime).
#
# THE FIX: the static block below ends with `try_files $uri @laravel;` and a
# named `location @laravel { … }` duplicates the proxy settings of
# `location /`. So a real asset is served from disk; a missing one falls
# through to Laravel (via Varnish) instead of 404ing. See the two marked
# blocks in the 443 server.
#
# HOW TO USE
# ----------
# CloudPanel vhosts are root-owned, so CI cannot patch them. When you create a
# new site in the CloudPanel UI for a Livewire v4 / Filament app, open
#   Sites → <site> → Vhost
# and paste this template, replacing {{server_name}} with the site's domain
# (e.g. `dari.codenzia.com www.dari.codenzia.com`). CloudPanel expands the
# remaining {{…}} placeholders itself. All other {{…}} tokens are kept
# verbatim — do NOT hand-edit them.
# =============================================================================

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name {{server_name}};   # ← REPLACE with the site's domain(s)
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Static assets served straight from disk for speed.
  # FIX: `try_files $uri @laravel;` — if the file does NOT exist on disk
  # (Livewire v4 / Filament dynamic asset routes such as
  # /livewire/livewire.min.js), fall through to Laravel instead of 404ing.
  location ~* ^.+\.(css|js|mjs|map|jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav|flv|swf|pdf|zip|gz|tar|rar|7z|doc|docx|xls|xlsx|ppt|pptx|txt|xml|json)$ {
    expires max;
    access_log off;
    add_header Cache-Control "public";
    try_files $uri @laravel;
  }

  location / {
    {{varnish_proxy_pass}}
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # FIX: named fallback for missing static files — duplicates the proxy
  # settings of `location /` so dynamic Livewire/Filament asset routes reach
  # Laravel through Varnish.
  location @laravel {
    {{varnish_proxy_pass}}
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name {{server_name}};   # ← REPLACE with the site's domain(s)
  {{root}}

  index index.php index.html;

  {{nginx_access_log}}
  {{nginx_error_log}}

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Must stay wrapped as a fastcgi_param: CloudPanel expands {{php_settings}}
    # to a raw PHP ini string, which nginx rejects as an unknown directive if
    # the token is emitted bare. This matches CloudPanel's own stock vhost.
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
